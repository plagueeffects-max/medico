<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Medico Admin</title>
  <link rel="icon" type="image/svg+xml" href="/favicon/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/assets/css/admin.css?v=1">
</head>
<body>
  <div class="app" id="app">
    <aside class="side" id="side" aria-label="Admin navigation">
      <a href="#overview" class="brand"><span class="brand-mark" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg></span><span>Medico<small>Admin</small></span></a>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot nav">
        <a href="/" target="_blank" rel="noopener" data-icon="external"><span>View website</span></a>
        <a href="#" id="collapse" class="desktop-only" data-icon="sidebar"><span>Collapse</span></a>
        <a href="#" id="logout" data-icon="logout"><span>Sign out</span></a>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="btn btn-ghost btn-icon mobile-only" id="menu" aria-label="Open menu" data-icon="menu"></button>
        <h1 id="title">Overview</h1>
        <div class="topbar-actions">
          <div id="actions" class="row"></div>
          <button class="search-trigger" id="open-palette" type="button" aria-label="Search and commands" data-icon="search"><span class="label-text">Search or jump to…</span><kbd class="kbd" id="kbd-hint">Ctrl K</kbd></button>
        </div>
      </header>
      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <dialog class="palette" id="palette" aria-label="Command palette">
    <input id="palette-input" type="text" placeholder="Type a page, an action or an article title…" autocomplete="off" aria-label="Search">
    <ul id="palette-list" role="listbox"></ul>
  </dialog>
  <script src="/assets/js/admin.js?v=1"></script>
  <script src="/assets/js/admin-content.js?v=1"></script>
</body>
</html>
