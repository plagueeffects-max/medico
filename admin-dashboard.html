<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f9fa">
  <meta name="robots" content="noindex, nofollow">
  <title>Overview | Admin | Medico</title>
  <link rel="icon" type="image/svg+xml" href="/favicon/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/assets/css/admin.css?v=4">
</head>
<body>
  <div class="app" id="app">
    <aside class="side" id="side" aria-label="Admin navigation">
      <a href="#overview" class="brand">
        <span class="brand-mark" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg></span>
        <span class="brand-info">
          <span class="brand-title">Medico</span>
          <small class="brand-sub">Website admin</small>
        </span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot nav">
        <a href="/" target="_blank" rel="noopener" data-icon="external"><span>View website</span></a>
        <a href="#" id="collapse" class="desktop-only" data-icon="sidebar"><span>Collapse</span></a>
        <a href="#" id="logout" data-icon="logout"><span>Sign out</span></a>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="topbar-title-wrap">
          <h1 id="title">Overview</h1>
        </div>
        <div class="topbar-actions">
          <div id="actions" class="row"></div>
          <button class="search-trigger" id="open-palette" type="button" aria-label="Search or go to a page" data-icon="search"><span class="label-text">Search or go to…</span><kbd class="kbd" id="kbd-hint">Ctrl K</kbd></button>
        </div>
      </header>
      <main class="view" id="view" tabindex="-1"></main>
    </div>
    <nav class="tabbar" id="tabbar" aria-label="Main sections"></nav>
  </div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <dialog class="palette" id="palette" aria-label="Search">
    <div class="palette-head"><input id="palette-input" type="search" placeholder="Search pages, articles or products" autocomplete="off" aria-label="Search"><button type="button" class="btn btn-ghost" id="palette-close">Close</button></div>
    <ul id="palette-list" role="listbox"></ul>
  </dialog>
  <script src="/assets/js/admin.js?v=4"></script>
  <script src="/assets/js/admin-content.js?v=4"></script>
</body>
</html>
