<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medico | Product Details</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800;900&family=Space+Grotesk:wght@300;500;700;900&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/products-data.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js" defer></script>

    <style>
        .product-page-container {
            max-width: 1400px;
            margin: 120px auto 100px;
            padding: 0 20px;
        }

        .back-link {
            display: inline-block;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 30px;
            transition: var(--transition-fast);
        }

        .back-link:hover {
            color: var(--accent-red);
        }

        .product-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            margin-bottom: 80px;
        }

        @media (max-width: 992px) {
            .product-grid {
                grid-template-columns: 1fr;
            }
        }

        .gallery-main {
            background: var(--bg-offwhite);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border-light);
            aspect-ratio: 1 / 1;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            position: relative;
        }

        .gallery-main img, .gallery-main video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 40px;
            transition: transform 0.25s cubic-bezier(0.2, 0, 0, 1);
        }

        .gallery-main:hover img {
            cursor: crosshair;
        }

        .gallery-thumbs {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .thumb-item {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            border: 2px solid transparent;
            cursor: pointer;
            overflow: hidden;
            background: var(--bg-offwhite);
            flex-shrink: 0;
            transition: var(--transition-fast);
        }

        .thumb-item.active {
            border-color: var(--accent-red);
        }

        .thumb-item img, .thumb-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-category {
            color: var(--accent-red);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .product-title {
            font-size: clamp(2rem, 4vw, 3rem);
            line-height: 1.1;
            margin-bottom: 10px;
            color: var(--text-dark);
        }

        .product-meta {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 30px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .stock-badge {
            background: rgba(22, 163, 74, 0.1);
            color: #16a34a;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
        }
        
        .stock-badge.out { background: rgba(211, 47, 47, 0.1); color: var(--accent-red); }
        .stock-badge.low { background: rgba(217, 119, 6, 0.1); color: #d97706; }

        .product-price-container {
            display: flex;
            align-items: baseline;
            gap: 15px;
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--border-light);
        }

        .product-price {
            font-size: 2.5rem;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            color: var(--text-dark);
        }

        .product-compare-price {
            font-size: 1.5rem;
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .product-short-desc {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 40px;
        }

        .add-to-cart-btn {
            background: var(--text-dark);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 400px;
            font-family: 'Inter', sans-serif;
        }

        .add-to-cart-btn:hover {
            background: var(--accent-red);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px var(--accent-glow);
        }

        .product-actions-extra {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
            max-width: 400px;
        }

        .btn-extra {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #ffffff;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 12px 5px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-dark);
            text-decoration: none;
            transition: var(--transition-fast);
            cursor: pointer;
        }

        .btn-extra:hover {
            border-color: var(--text-dark);
            transform: translateY(-2px);
        }

        .btn-group-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .tabs-container {
            margin-top: 60px;
            border: 1px solid var(--border-light);
            border-radius: 16px;
            background: var(--bg-pure);
            overflow: hidden;
        }

        .tabs-header {
            display: flex;
            border-bottom: 1px solid var(--border-light);
            background: var(--bg-offwhite);
            overflow-x: auto;
        }

        .tab-btn {
            padding: 20px 40px;
            background: transparent;
            border: none;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition-fast);
            white-space: nowrap;
        }

        .tab-btn.active {
            color: var(--text-dark);
            background: var(--bg-pure);
            border-bottom: 2px solid var(--accent-red);
        }

        .tab-content {
            display: none;
            padding: 40px;
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--text-dark);
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #errorContainer { text-align: center; padding: 150px 20px; display: none; }
        .skip-link { position: absolute; top: -100px; left: 0; background: #000; color: #fff; padding: 10px; z-index: 9999; }
        .skip-link:focus { top: 0; }
    </style>
</head>
<body>

    <a href="#main-content" class="skip-link">Skip to content</a>

    <nav id="navbar" style="background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-light);">
        <a href="index.html" class="brand" style="text-decoration:none; color:inherit;">Medico<span>.</span></a>
        <div class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="shop.html" class="nav-link" style="color: var(--accent-red);">Products</a>
            <a href="about.html" class="nav-link">About Us</a>
            <a href="blog.html" class="nav-link">Blog</a>
            <a href="admin-login.html" class="login-btn">Admin Login</a>
        </div>
    </nav>

    <main id="main-content">
        <div id="errorContainer">
            <h1>Product Not Found</h1>
            <p>The product you are looking for does not exist.</p>
            <a href="shop.html">Return to Shop</a>
        </div>

        <div class="product-page-container" id="productContainer" style="display: none;">
            <a href="shop.html" class="back-link">← Back to Catalog</a>

            <div class="product-grid">
                
                <!-- Left: Gallery -->
                <div class="product-gallery reveal">
                    <div class="gallery-main" id="mainGalleryImage">
                        <!-- Populated by JS -->
                    </div>
                    <div class="gallery-thumbs" id="galleryThumbs">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- Right: Info -->
                <div class="product-info reveal" style="transition-delay: 0.1s;">
                    <div class="product-category" id="productCategory">Category</div>
                    <h1 class="product-title" id="productTitle">Product Title</h1>
                    
                    <div class="product-meta">
                        <span class="stock-badge" id="productStock">In Stock</span>
                        <span id="productSku" style="display: none;">SKU: <span id="skuValue"></span></span>
                    </div>

                    <div class="product-price-container" id="priceContainer">
                        <div class="product-price" id="productPrice">₹0</div>
                        <div class="product-compare-price" id="productComparePrice" style="display: none;">₹0</div>
                    </div>

                    <div class="product-short-desc" id="productShortDesc"></div>

                    <button class="add-to-cart-btn" id="addToCartBtn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                        Add to Cart
                    </button>

                    <div class="product-actions-extra">
                        <a href="#" id="downloadBrochureBtn" class="btn-extra" style="display: none; width:100%; padding:15px;" download>
                            Download Brochure
                        </a>
                        <div class="btn-group-4">
                            <a href="#" target="_blank" class="btn-extra" id="whatsappBtn">WhatsApp</a>
                            <a href="tel:+919419008453" class="btn-extra">Phone</a>
                            <a href="mailto:medicosgr@gmail.com" class="btn-extra" id="emailBtn">Email</a>
                            <button onclick="navigator.share({title: document.title, url: window.location.href})" class="btn-extra">Share</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tabs-container reveal" style="transition-delay: 0.2s;">
                <div class="tabs-header">
                    <button class="tab-btn active" onclick="switchTab('desc')">Description</button>
                    <button class="tab-btn" onclick="switchTab('specs')" id="tabBtnSpecs">Specifications</button>
                    <button class="tab-btn" onclick="switchTab('box')" id="tabBtnBox">What's in the Box</button>
                </div>
                <div class="tab-content active" id="tab-desc"></div>
                <div class="tab-content" id="tab-specs"></div>
                <div class="tab-content" id="tab-box"></div>
            </div>
        </div>
    </main>

    <script>
        function switchTab(id) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + id).classList.add('active');
        }

        function setMainMedia(src) {
            const ext = src.split('.').pop().toLowerCase();
            const isVideo = ext === 'mp4' || ext === 'webm' || src.startsWith('data:video');
            const el = document.getElementById('mainGalleryImage');
            el.innerHTML = isVideo ? `<video src="${src}" autoplay loop muted playsinline controls></video>` : `<img src="${src}" onerror="this.src='images/medico_shop.webp'">`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const id = new URLSearchParams(window.location.search).get('id');
            const p = ProductsDB.getProducts().find(x => x.id === id);
            if (!p) { document.getElementById('errorContainer').style.display = 'block'; return; }
            
            document.getElementById('productContainer').style.display = 'block';
            document.getElementById('productTitle').textContent = p.title;
            document.getElementById('productCategory').textContent = p.category;
            document.getElementById('productShortDesc').textContent = p.description;
            document.getElementById('productPrice').textContent = `₹${p.price.toLocaleString()}`;
            
            if (p.sku) {
                document.getElementById('productSku').style.display = 'inline';
                document.getElementById('skuValue').textContent = p.sku;
            }

            const stock = document.getElementById('productStock');
            stock.textContent = p.stock || 'In Stock';
            if(p.stock === 'Out of Stock') stock.className = 'stock-badge out';
            else if(p.stock === 'Low Stock') stock.className = 'stock-badge low';

            setMainMedia(p.mainImage || 'images/medico_shop.webp');
            
            // Render thumbs if gallery exists
            const thumbs = document.getElementById('galleryThumbs');
            if (p.galleryImages && p.galleryImages.length > 0) {
                const allImages = [p.mainImage, ...p.galleryImages].filter(Boolean);
                thumbs.innerHTML = allImages.map(img => `
                    <div class="thumb-item" onclick="setMainMedia('${img}')">
                        <img src="${img}" onerror="this.src='images/medico_shop.webp'">
                    </div>
                `).join('');
            }
            
            // XSS Protection with DOMPurify
            document.getElementById('tab-desc').innerHTML = typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(p.longDescription || p.description) : (p.longDescription || p.description);
            
            if(p.specifications && p.specifications.length > 0) {
                document.getElementById('tab-specs').innerHTML = p.specifications.map(s => `
                    <div style="display:grid; grid-template-columns: 1fr 1fr; padding:10px 0; border-bottom:1px solid #eee;">
                        <span style="font-weight:600;">${s.label}</span>
                        <span>${s.value}</span>
                    </div>
                `).join('');
            } else {
                document.getElementById('tabBtnSpecs').style.display = 'none';
            }

            if(p.inTheBox) {
                document.getElementById('tab-box').innerHTML = typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(p.inTheBox) : p.inTheBox;
            } else {
                document.getElementById('tabBtnBox').style.display = 'none';
            }

            // CTA Links
            document.getElementById('whatsappBtn').href = `https://wa.me/919419008453?text=I'm interested in ${encodeURIComponent(p.title)}`;
            document.getElementById('emailBtn').href = `mailto:medicosgr@gmail.com?subject=Enquiry about ${encodeURIComponent(p.title)}`;
            
            // Reveal animations
            setTimeout(() => {
                document.querySelectorAll('.reveal').forEach(el => el.classList.add('active'));
            }, 100);
        });
    </script>
</body>
</html>
