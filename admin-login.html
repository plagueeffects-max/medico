<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in | Medico Admin</title>
  <link rel="icon" type="image/svg+xml" href="/favicon/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/assets/css/admin.css?v=1">
</head>
<body>
  <main class="login">
    <form class="login-card" id="login-form" novalidate>
      <span class="brand-mark" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg></span>
      <h1>Medico admin</h1>
      <p>Sign in to manage articles, products, inquiries and site text.</p>
      <div class="field">
        <label for="email">Email</label>
        <input class="input" id="email" name="email" type="email" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <p class="form-error" id="error" role="alert"></p>
      <button class="btn btn-primary" type="submit" id="submit" style="width:100%">Sign in</button>
      <p class="small muted" style="margin:16px 0 0"><a href="/">Back to the website</a></p>
    </form>
  </main>
  <script>
    (async () => {
      // Already signed in? Go straight to the dashboard.
      try { const r = await fetch('/api/admin/me', { credentials: 'same-origin' }); if (r.ok) location.replace('/admin-dashboard.html'); } catch { /* offline */ }
    })();
    const form = document.getElementById('login-form');
    const error = document.getElementById('error');
    const submit = document.getElementById('submit');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.textContent = '';
      if (!form.email.value.trim() || !form.password.value) { error.textContent = 'Please enter your email and password.'; return; }
      submit.classList.add('is-busy');
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: form.email.value.trim(), password: form.password.value }),
        });
        const json = await res.json().catch(() => ({}));
        if (!res.ok || !json.ok) throw new Error(json.error || 'Sign-in failed. Please try again.');
        const next = new URLSearchParams(location.search).get('next');
        location.replace(next && next.startsWith('/admin-dashboard.html') ? next : '/admin-dashboard.html');
      } catch (err) {
        error.textContent = err.message;
        form.password.select();
      } finally { submit.classList.remove('is-busy'); }
    });
  </script>
</body>
</html>
