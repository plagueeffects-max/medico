<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f8f9fa">
  <title>Sign In | Admin | Medico</title>
  <link rel="icon" type="image/svg+xml" href="/favicon/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/assets/css/admin.css?v=3">
</head>
<body class="login-page">
  <main class="login">
    <form class="login-card" id="login-form" novalidate>
      <div class="login-brand-header">
        <span class="brand-mark" aria-hidden="true">
          <svg class="i" viewBox="0 0 24 24"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg>
        </span>
        <div class="login-brand-text">
          <span class="login-brand-name">Medico</span>
          <span class="login-brand-badge">Website admin</span>
        </div>
      </div>
      <h1>Sign in</h1>
      <p class="login-sub">Manage your enquiries, products, articles and website text.</p>

      <div class="field">
        <label for="email">Email</label>
        <input class="input" id="email" name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="off" spellcheck="false" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="button" class="password-toggle" id="toggle-password" aria-label="Show password" aria-pressed="false">Show</button>
        </div>
      </div>

      <p class="form-error" id="error" role="alert"></p>

      <button class="btn btn-primary login-btn" type="submit" id="submit">Sign in</button>

      <div class="login-foot">
        <a class="login-back-link" href="/">
          <svg class="i" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Back to the website
        </a>
        <span class="muted small">Forgot your password? Ask your web developer.</span>
      </div>
    </form>
  </main>
  <script>
    (async () => {
      // Already signed in? Go straight to the dashboard.
      try { const r = await fetch('/api/admin/me', { credentials: 'same-origin' }); if (r.ok) location.replace('/admin-dashboard.html'); } catch { /* offline */ }
    })();
    const form = document.getElementById('login-form');
    const error = document.getElementById('error');
    const submit = document.getElementById('submit');
    const toggle = document.getElementById('toggle-password');
    toggle.addEventListener('click', () => {
      const show = form.password.type === 'password';
      form.password.type = show ? 'text' : 'password';
      toggle.textContent = show ? 'Hide' : 'Show';
      toggle.setAttribute('aria-pressed', String(show));
      toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      form.password.focus();
    });
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.textContent = '';
      if (!form.email.value.trim() || !form.password.value) { error.textContent = 'Please enter your email and password.'; (form.email.value.trim() ? form.password : form.email).focus(); return; }
      submit.classList.add('is-busy');
      submit.disabled = true;
      try {
        let res;
        try {
          res = await fetch('/api/admin/login', {
            method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: form.email.value.trim(), password: form.password.value }),
          });
        } catch { throw new Error('Could not reach the website. Check your internet connection and try again.'); }
        const json = await res.json().catch(() => ({}));
        if (res.status === 401) throw new Error('That email and password do not match. Please check them and try again.');
        if (res.status === 429) throw new Error('Too many attempts. Please wait 15 minutes and try again.');
        if (!res.ok || !json.ok) throw new Error(json.error && json.error.length < 160 && !/[{}<>]/.test(json.error) ? json.error : 'Sign-in did not work. Please try again.');
        const next = new URLSearchParams(location.search).get('next');
        location.replace(next && next.startsWith('/admin-dashboard.html') ? next : '/admin-dashboard.html');
      } catch (err) {
        error.textContent = err.message;
        form.password.select();
      } finally { submit.classList.remove('is-busy'); submit.disabled = false; }
    });
  </script>
</body>
</html>
