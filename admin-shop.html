<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medico Group | Admin Shop</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800;900&family=Space+Grotesk:wght@300;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Quill Rich Text Editor -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-pure: #ffffff;
            --bg-offwhite: #fafafa;
            --bg-grey: #f0f2f5;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --accent-red: #e11d48;
            --border-light: #e2e8f0;
            --transition-fast: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-grey); color: var(--text-dark); }
        .admin-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-light); position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
        .brand { font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; font-weight: 800; }
        .brand span { color: var(--accent-red); }
        .nav-actions { display: flex; gap: 20px; align-items: center; }
        .btn { padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: var(--transition-fast); border: 1px solid transparent; }
        .btn-primary { background: var(--text-dark); color: #ffffff; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15); }
        .btn-primary:hover { background: var(--accent-red); box-shadow: 0 6px 16px rgba(225, 29, 72, 0.2); transform: translateY(-2px); }
        .btn-outline { background: #ffffff; border-color: var(--border-light); color: var(--text-dark); }
        
        .container { max-width: 1400px; margin: 40px auto; padding: 0 20px; }
        .top-section { display: grid; grid-template-columns: 480px 1fr; gap: 40px; margin-bottom: 60px; }
        @media (max-width: 1000px) { .top-section { grid-template-columns: 1fr; } }
        
        .card { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); border-radius: 16px; padding: 35px; border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 10px 40px rgba(0,0,0,0.03), 0 1px 3px rgba(0,0,0,0.05); height: fit-content; }
        .preview-card { position: sticky; top: 100px; max-height: calc(100vh - 140px); overflow-y: auto; padding: 0; }
        .preview-card-header { position: sticky; top: 0; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); padding: 20px 30px; border-bottom: 1px solid var(--border-light); display: flex; justify-content: space-between; align-items: center; z-index: 10; border-radius: 16px 16px 0 0; }
        .preview-card-content { padding: 30px; }
        
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; color: #334155; }
        .form-control { width: 100%; padding: 12px 14px; border: 1px solid var(--border-light); border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 0.95rem; background: #ffffff; }

        .file-input-btn { background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; padding: 25px; text-align: center; cursor: pointer; display: block; }
        input[type="file"] { display: none; }

        .product-list { display: flex; flex-direction: column; gap: 20px; }
        .product-item { background: #ffffff; border: 1px solid var(--border-light); border-radius: 12px; padding: 20px; display: flex; justify-content: space-between; }

        .skip-link { position: absolute; top: -100px; left: 0; background: #000; color: #fff; padding: 10px; z-index: 9999; }
        .skip-link:focus { top: 0; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js" defer></script>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to content</a>

    <script>
        const token = sessionStorage.getItem('medico_admin_auth');
        if (!token) { window.location.href = 'admin-login.html'; }
    </script>

    <nav class="admin-nav">
        <a href="index.html" class="brand">Medico<span>.</span> Store Management</a>
        <div class="nav-actions">
            <a href="admin-dashboard.html" class="btn btn-outline">Manage Blog</a>
            <button onclick="logout()" class="btn btn-outline">Logout</button>
        </div>
    </nav>

    <main id="main-content" class="container">
        <div class="top-section">
            <div class="card">
                <h2 style="margin-bottom:20px;">Add New Product</h2>
                <form id="productForm">
                    <input type="hidden" id="productId">
                    <div class="form-group">
                        <label class="form-label">Product Name</label>
                        <input type="text" id="title" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Price (₹)</label>
                        <input type="number" id="price" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Category</label>
                        <input type="text" id="category" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Product Image</label>
                        <label class="file-input-btn" for="imageUpload">Upload Image</label>
                        <input type="file" id="imageUpload" accept="image/*">
                        <input type="hidden" id="imageBase64">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Long Description</label>
                        <div id="editor" style="height: 250px; background:white;"></div>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%;">Save Product</button>
                </form>
            </div>

            <div class="card preview-card">
                <div class="preview-card-header"><h2>Product Preview</h2></div>
                <div class="preview-card-content" id="live-preview-container"></div>
            </div>
        </div>

        <div class="card" style="margin-top:40px;">
            <h2>Inventory List</h2>
            <div class="product-list" id="admin-product-list"></div>
        </div>
    </main>

    <script src="assets/js/products-data.js"></script>
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
        var quill = new Quill('#editor', { theme: 'snow' });

        function updatePreview() {
            const title = document.getElementById('title').value || 'Product Name';
            const price = document.getElementById('price').value || '0';
            const category = document.getElementById('category').value || 'Category';
            const img = document.getElementById('imageBase64').value || 'images/medico_shop.webp';
            const desc = quill.root.innerHTML;

            const html = `
                <div style="text-align:center;">
                    <img src="${img}" style="width:200px; height:200px; object-fit:contain; margin-bottom:20px;">
                    <h2 style="font-size:1.5rem;">${title}</h2>
                    <p style="color:#e11d48; font-weight:bold; font-size:1.2rem; margin:10px 0;">₹${parseInt(price).toLocaleString()}</p>
                    <p style="color:#64748b; font-size:0.9rem; text-transform:uppercase;">${category}</p>
                    <hr style="margin:20px 0; border:0; border-top:1px solid #e2e8f0;">
                    <div class="ql-editor" style="text-align:left;">${desc}</div>
                </div>
            `;
            
            if (typeof DOMPurify !== 'undefined') {
                document.getElementById('live-preview-container').innerHTML = DOMPurify.sanitize(html);
            } else {
                document.getElementById('live-preview-container').innerHTML = html;
            }
        }

        document.getElementById('productForm').addEventListener('input', updatePreview);
        quill.on('text-change', updatePreview);

        document.getElementById('imageUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    document.getElementById('imageBase64').value = evt.target.result;
                    updatePreview();
                };
                reader.readAsDataURL(file);
            }
        });

        function renderAdminProducts() {
            const list = document.getElementById('admin-product-list');
            const products = ProductsDB.getProducts();
            let html = '';
            products.forEach(p => {
                html += `
                    <div class="product-item">
                        <div><h3>${p.title}</h3><p>₹${p.price.toLocaleString()}</p></div>
                        <div><button onclick="deleteProduct('${p.id}')" class="btn btn-outline" style="color:red;">Delete</button></div>
                    </div>
                `;
            });
            list.innerHTML = typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(html) : html;
        }

        function deleteProduct(id) { if(confirm('Delete?')) { ProductsDB.deleteProduct(id); renderAdminProducts(); } }
        function logout() { sessionStorage.removeItem('medico_admin_auth'); window.location.href = 'index.html'; }

        document.addEventListener('DOMContentLoaded', renderAdminProducts);
    </script>
</body>
</html>
